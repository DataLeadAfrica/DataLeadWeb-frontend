<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tab and home screen icons. logo.svg is unchanged and is what a
         modern browser uses; the other three are for the places an SVG
         is not: /favicon.ico (16, 32 and 48 in one file) for older
         browsers and for anything that just asks for /favicon.ico,
         apple-touch-icon.png (180) for iOS, icon-192.png for Android.
         All three are the mark on white, so it reads on a dark tab bar. -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="google-site-verification"
      content="Sr0qigr7UoJlfBl8RcxNwlKkXk_VOg86y2jBpZn9Zq4"
    />

    <!-- SEO: default title + description (per-page values are set by the <Seo> component) -->
    <title>Data-Lead Africa — Turning Data to Decision</title>
    <meta
      name="description"
      content="Data-Lead Africa is a research and training consultancy offering practitioner-led bootcamps in data analytics, AI, business analytics, bioinformatics and research methods — online or onsite in Abuja, across Africa."
    />
    <meta name="theme-color" content="#f56e0f" />

    <!--
      THERE IS DELIBERATELY NO canonical OR og:url HERE.

      Both used to be hard coded to the homepage. index.html is served
      for every address on the site, so the very first HTML a search
      engine received for /courses, for every blog post and for every
      research page said "this is a copy of the homepage". A crawler
      that does not run JavaScript never saw anything else, and one that
      does still read it first.

      They are now set per page: by the Seo component once React has
      booted, and, for the pages that need to be right before that, by
      the edge functions in api/, which write the correct tags into this
      file before it is sent.

      If you ever add one back here, every page on the site goes back to
      claiming to be the homepage.
    -->

    <!-- Social / link previews (Open Graph + Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Data-Lead Africa" />
    <meta property="og:title" content="Data-Lead Africa — Turning Data to Decision" />
    <meta
      property="og:description"
      content="Practitioner-led bootcamps in data analytics, AI, business analytics, bioinformatics and research methods — online or onsite in Abuja, across Africa."
    />
    <meta property="og:image" content="https://dataleadafrica.com/assets/index/hero.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Data-Lead Africa — Turning Data to Decision" />
    <meta
      name="twitter:description"
      content="Practitioner-led bootcamps in data analytics, AI and research — online or onsite in Abuja, across Africa."
    />
    <meta name="twitter:image" content="https://dataleadafrica.com/assets/index/hero.png" />

    <!-- EmailJS SDK (used by the brochure form to send emails) -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
